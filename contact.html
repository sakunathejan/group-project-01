<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Contact — ABC Academy</title>
</head>

<body>
    <main>
        <header>
            <h1>Contact ABC Academy</h1>
            <p>Questions about admissions, courses, or partnerships? Get in touch.</p>
        </header>
    </main>
    <section aria-labelledby="contact-info">
        <h2 id="contact-info">Contact information</h2>
        <p><strong>Address:</strong> 223A Galle Road, Panadura 12500</p>
        <p><strong>Phone:</strong> <a>+94 070 580 580 5</a></p>
        <p><strong>Email:</strong> <a>abcacademy@gmail.com</a></p>
        <p><strong>Hours:</strong> Mon–Fri 8:30–17:00</p>
    </section>

    <section aria-labelledby="send-message">
				<h2 id="send-message">Send us a message</h2>
				<form action="#" method="post">
					<div>
						<label for="name">Full name</label><br>
						<input type="text" id="name" name="name" required>
					</div>

					<div>
						<label for="email">Email</label><br>
						<input type="email" id="email" name="email" required>
					</div>

					<div>
						<label for="subject">Subject</label><br>
						<input type="text" id="subject" name="subject" required>
					</div>

					<div>
						<label for="type">Enquiry type</label><br>
						<select id="type" name="type">
							<option value="general">General</option>
							<option value="admissions">Admissions</option>
							<option value="courses">Courses</option>
							<option value="partnerships">Partnerships</option>
						</select>
					</div>

					<div>
						<label for="message">Message</label><br>
						<textarea id="message" name="message" rows="6" required></textarea>
					</div>

					<div>
						<button type="submit">Send message</button>
						<button type="reset">Clear</button>
					</div>
				</form>
			</section>
</body>

</html>
